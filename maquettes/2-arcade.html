<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DA 2 · Arcade Fighter</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#ffe14d;--m:#ff2e88;--c:#22e6ff;--bg:#0d0620}
*{box-sizing:border-box;margin:0}
body{height:100vh;overflow:hidden;color:#fff;font-family:Teko,sans-serif;background:
 radial-gradient(circle at 50% 50%,rgba(255,46,136,.25),transparent 55%),
 repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 3px,transparent 3px 14px),var(--bg);display:grid;grid-template-rows:96px 1fr 1fr 176px}
/* fighting-game HUD */
.hud{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;padding:0 24px;gap:14px}
.life{position:relative}
.life .name{font-family:'Russo One';font-size:24px;letter-spacing:1px;text-shadow:3px 3px 0 #000}
.life .gauge{height:30px;background:#2a0f3d;border:3px solid #fff;transform:skewX(-18deg);overflow:hidden;box-shadow:4px 4px 0 #000}
.life .gauge i{display:block;height:100%;background:linear-gradient(var(--y),#ff9f1c)}
.life.right{text-align:right}.life.right .gauge{transform:skewX(18deg);direction:rtl}
.life .pv{position:absolute;top:30px;font-family:'Russo One';font-size:34px;color:var(--y);text-shadow:3px 3px 0 #000}
.life.left .pv{right:6px}.life.right .pv{left:6px}
.timer{text-align:center;font-family:'Russo One';font-size:52px;line-height:.9;color:var(--y);text-shadow:4px 4px 0 var(--m)}
.timer small{display:block;font-size:14px;color:#fff;text-shadow:none;letter-spacing:3px}
/* lanes */
.lane{display:grid;grid-template-columns:200px 1fr 200px;align-items:center;padding:0 24px;position:relative}
.lane.ai{background:linear-gradient(90deg,transparent,rgba(34,230,255,.08),transparent)}
.lane.me{background:linear-gradient(90deg,transparent,rgba(255,46,136,.1),transparent)}
.row{display:flex;justify-content:center;gap:18px;align-items:center}
.card{width:138px;aspect-ratio:496/693;position:relative;transform:skewX(-4deg);border:3px solid #fff;box-shadow:6px 6px 0 #000;background:#000;transition:transform .12s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover{transform:skewX(-4deg) scale(1.08)}
.card .s{position:absolute;bottom:-14px;left:-8px;right:-8px;display:flex;justify-content:space-between}
.card .s b{font-family:'Russo One';font-size:20px;padding:0 8px;box-shadow:3px 3px 0 #000}
.card .s .a{background:var(--m)}.card .s .e{background:var(--c);color:#000}
.passive .card{width:96px;opacity:.85;filter:saturate(.7)}
.empty{width:138px;aspect-ratio:496/693;border:3px dashed rgba(255,255,255,.25);transform:skewX(-4deg)}
.passive .empty{width:96px}
.tagz{font-family:'Russo One';font-size:12px;letter-spacing:2px;color:var(--c);margin-bottom:6px;text-align:center}
.me .tagz{color:var(--m)}
.side{display:flex;flex-direction:column;align-items:center}
.passive{display:flex;gap:10px}
/* VS splash */
.vs{position:absolute;left:50%;top:100%;transform:translate(-50%,-50%) rotate(-6deg);font-family:'Russo One';font-size:58px;color:var(--y);text-shadow:5px 5px 0 var(--m),-2px -2px 0 #000;z-index:4}
.hit{position:absolute;right:31%;top:20%;font-family:'Russo One';font-size:44px;color:#fff;text-shadow:4px 4px 0 var(--m);transform:rotate(-10deg);z-index:5}
.hit small{display:block;font-size:22px;color:var(--y)}
.spark{position:absolute;right:33%;top:28%;width:120px;height:120px;background:radial-gradient(circle,#fff 0 12%,var(--y) 20%,transparent 60%);clip-path:polygon(50% 0,60% 38%,100% 30%,66% 56%,90% 100%,50% 70%,10% 100%,34% 56%,0 30%,40% 38%);z-index:4}
/* combo meter / momentum */
.meter{display:flex;flex-direction:column;align-items:center;gap:6px}
.meter .box{width:120px;padding:8px;border:3px solid var(--y);transform:skewX(-10deg);text-align:center;font-family:'Russo One';font-size:13px;letter-spacing:1px;background:rgba(0,0,0,.4)}
.meter .box b{display:block;font-size:26px;color:var(--y)}
/* hand */
.hand{display:flex;justify-content:center;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.6));position:relative}
.hand .card{width:108px}
.hand .card.sel{transform:skewX(-4deg) translateY(-22px) scale(1.1);border-color:var(--y);box-shadow:0 0 0 4px var(--m),8px 8px 0 #000}
.btn{position:absolute;right:28px;font-family:'Russo One';font-size:22px;padding:14px 28px;background:var(--y);color:#000;border:4px solid #000;box-shadow:6px 6px 0 var(--m);transform:skewX(-10deg)}
.note{position:absolute;left:28px;max-width:260px;font-size:20px;line-height:1;color:#c9b8ff}
</style></head><body>
<header class="hud">
 <div class="life left"><div class="name">VOUS · THE BLOODLINE</div><div class="gauge"><i style="width:82%"></i></div><span class="pv">410</span></div>
 <div class="timer">05<small>TOUR</small></div>
 <div class="life right"><div class="name">L’IA · CPU</div><div class="gauge"><i style="width:53%"></i></div><span class="pv">265</span></div>
</header>

<section class="lane ai">
 <div class="meter"><div class="box">DECK<b>27</b></div><div class="box">CIMETIÈRE<b>6</b></div></div>
 <div><div class="tagz">ACTIFS</div><div class="row">
  <div class="card"><img src="/public/cards/catcheur-26.png"><div class="s"><b class="a">55</b><b class="e">90</b></div></div>
  <div class="card"><img src="/public/cards/catcheur-13.png"><div class="s"><b class="a">60</b><b class="e">20</b></div></div>
  <div class="card"><img src="/public/cards/catcheur-19.png"><div class="s"><b class="a">50</b><b class="e">80</b></div></div>
 </div></div>
 <div class="side"><div class="tagz">PASSIFS</div><div class="passive"><div class="empty"></div><div class="card"><img src="/public/cards/managers-03.png"></div></div></div>
 <div class="spark"></div><div class="hit">-60 !<small>GROS IMPACT</small></div>
 <div class="vs">VS</div>
</section>

<section class="lane me">
 <div class="meter"><div class="box">MOMENTUM<b>1/1</b></div><div class="box">MANAGER<b>HEYMAN</b></div></div>
 <div><div class="row">
  <div class="card"><img src="/public/cards/catcheur-21.png"><div class="s"><b class="a">50</b><b class="e">80</b></div></div>
  <div class="card" style="border-color:var(--y)"><img src="/public/cards/catcheur-04.png"><div class="s"><b class="a">65</b><b class="e">85</b></div></div>
  <div class="empty"></div>
 </div><div class="tagz" style="margin-top:20px">ACTIFS</div></div>
 <div class="side"><div class="passive"><div class="card"><img src="/public/cards/catcheur-22.png"></div><div class="empty"></div></div><div class="tagz" style="margin-top:8px">PASSIFS</div></div>
</section>

<footer class="hand">
 <p class="note">Gros chiffres, impacts façon jeu de combat, « K.-O. ! » plein écran.</p>
 <div class="card"><img src="/public/cards/momentum-20.png"></div>
 <div class="card"><img src="/public/cards/objets-05.png"></div>
 <div class="card sel"><img src="/public/cards/momentum-22.png"></div>
 <div class="card"><img src="/public/cards/catcheur-01.png"></div>
 <div class="card"><img src="/public/cards/wyatt-13.png"></div>
 <button class="btn">FIN DU TOUR ▶</button>
</footer>
</body></html>
